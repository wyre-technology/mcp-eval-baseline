name: 'WYRE MCP Eval Baseline'
description: 'Run the shared wyre-technology mcp-assert baseline against an MCP server'

inputs:
  entry:
    description: 'Path to the MCP server entry point (e.g. dist/index.js)'
    required: true
  canary-tool:
    description: 'Name of one tool to use for protocol-level assertions (any read-only tool)'
    required: true
  extra-suite:
    description: 'Optional path to a repo-local evals/ directory to run alongside the baseline'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Render baseline templates
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
        CANARY_TOOL: ${{ inputs.canary-tool }}
        ACTION_PATH: ${{ github.action_path }}
        EXTRA_SUITE: ${{ inputs.extra-suite }}
      run: |
        set -euo pipefail
        mkdir -p .mcp-eval-rendered
        for tpl in "$ACTION_PATH"/templates/*.yaml; do
          out=".mcp-eval-rendered/$(basename "$tpl")"
          envsubst < "$tpl" > "$out"
        done
        if [ -n "$EXTRA_SUITE" ] && [ -d "$EXTRA_SUITE" ]; then
          cp "$EXTRA_SUITE"/*.yaml .mcp-eval-rendered/ || true
        fi
        echo "--- Rendered suite ---"
        ls -la .mcp-eval-rendered/

    - name: Run mcp-assert
      uses: blackwell-systems/mcp-assert-action@v1
      with:
        suite: .mcp-eval-rendered/
        # Pinned instead of the action's own 'latest' default: resolving
        # latest re-runs an unauthenticated curl against api.github.com on
        # every fleet CI run (dozens of *-mcp repos x every push/PR), which
        # intermittently 403s under shared-runner-IP rate limiting. Pinning
        # removes the live API dependency entirely. Bump deliberately.
        version: v0.12.3
